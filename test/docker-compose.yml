services:
  hermes-agent:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-btcfoxman}/${IMAGE_NAME:-hermes-agent}:${IMAGE_TAG:-test-latest}
    container_name: hermes-agent
    restart: unless-stopped
    networks:
      - my-shared-net
    env_file:
      - ./.env
    environment:
      HERMES_OPENAI_BASE_URL: ${HERMES_OPENAI_BASE_URL:-}
      HERMES_OPENAI_API_KEY: ${HERMES_OPENAI_API_KEY:-}
      HERMES_MODEL: ${HERMES_MODEL:-gpt-4.1-mini}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
    ports:
      - "8095:8095"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

networks:
  my-shared-net:
    external: true
