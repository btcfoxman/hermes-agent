name: Deploy Test

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  IMAGE_NAME: hermes-agent
  IMAGE_TAG_LATEST: test-latest

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Prepare image metadata
        id: meta
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          echo "image=${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "image_sha_tag=test-${short_sha}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ai_marketing_api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ env.IMAGE_TAG_LATEST }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.image_sha_tag }}
          cache-from: type=gha,scope=hermes-agent
          cache-to: type=gha,mode=max,scope=hermes-agent
          provenance: false
          sbom: false

  deploy:
    name: Deploy to 192.168.3.6
    needs: build
    runs-on:
      - self-hosted
      - linux
      - aitoearn-test
    env:
      APP_DIR: /home/btcfoxman/docker/hermes-agent
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
      IMAGE_NAME: hermes-agent
      IMAGE_TAG: test-latest
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
    steps:
      - name: Fetch deployment files
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY##*/}"
          work_dir="${RUNNER_TEMP:-/tmp}/${repo_name}-repo-${GITHUB_RUN_ID}"
          rm -rf "${work_dir}"
          mkdir -p "${work_dir}"

          auth_config="${work_dir}/.curl-auth"
          {
            printf 'header = "Authorization: Bearer %s"\n' "${CHECKOUT_TOKEN}"
            printf 'header = "Accept: application/vnd.github.raw"\n'
            printf 'header = "X-GitHub-Api-Version: 2022-11-28"\n'
          } > "${auth_config}"
          chmod 600 "${auth_config}"

          download_file() {
            local path="$1"
            mkdir -p "${work_dir}/$(dirname "${path}")"
            curl --config "${auth_config}" \
              --fail --location --silent --show-error \
              --retry 5 --retry-delay 5 --connect-timeout 20 --max-time 120 \
              -o "${work_dir}/${path}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_SHA}"
          }

          for file in test/deploy.sh test/docker-compose.yml test/.env.example
          do
            download_file "${file}"
          done

          rm -f "${auth_config}"
          chmod +x "${work_dir}/test/deploy.sh"
          echo "REPO_WORK_DIR=${work_dir}" >> "${GITHUB_ENV}"

      - name: Deploy
        run: |
          set -euo pipefail
          cd "${REPO_WORK_DIR}"
          bash test/deploy.sh
